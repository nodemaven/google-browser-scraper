<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SERP Maven">
<style>
.hd{transform-box:view-box;transform-origin:35px 25px;animation:tilt 5s ease-in-out infinite}
.ey{transform-box:fill-box;transform-origin:center;animation:blink 5s linear infinite}
@keyframes tilt{0%,38%{transform:rotate(0)}46%,56%{transform:rotate(22deg)}50%{transform:rotate(17deg)}64%,100%{transform:rotate(0)}}
@keyframes blink{0%,74%{transform:scaleY(1)}76%{transform:scaleY(.1)}78%,84%{transform:scaleY(1)}86%{transform:scaleY(.1)}88%,100%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.hd,.ey{animation:none}}
</style>
