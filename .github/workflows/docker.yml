# Publish the Docker image to GitHub Container Registry as
# ghcr.io/nodemaven/google-browser-scraper, tagged with the release version and
# `latest`.
#
# Like publish.yml it publishes on a published release, so the image and the
# PyPI package always come from the same tag; it can also be started by hand on
# a `v*` release tag to rebuild that version. A manual run on a branch, and a
# pull request that touches anything in the image, only build it. The build job
# can read the repository and nothing else; only the publish job, which never
# runs for a pull request, may write to the package.
name: docker

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - src/**
      - pyproject.toml
      - README.md
      - LICENSE
      - .github/workflows/docker.yml

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha

  publish:
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The version is the tag without its `v`. Python versions such as
      # 0.0.5.post1 are not semver, so the tag is matched, not parsed.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
