name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # A healthy job takes a few minutes; a stuck install should fail, not
    # hold the pull request for the six-hour default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m patchright install --with-deps chromium
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      # Everything runs offline: the browser tests drive a fake Google on
      # 127.0.0.1, and nothing here needs a proxy or a real search.
      - name: Test
        run: python -m pytest -q
      # The old names: no code of their own, so installing them next to this
      # build, with their dependency on serpmaven resolved against it, must give
      # the old commands running the new CLI.
      - name: Old names
        run: |
          python -m pip install ./legacy/gserp ./legacy/google-browser-scraper
          gserp --version
          google-browser-scraper --version

  # Warnings, not failures: a pull request is told which functions or modules
  # it makes longer than the limits in scripts/code_audit.py.
  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Longer functions and modules
        run: python scripts/code_audit.py --base "origin/${{ github.base_ref }}"

  # The branch protection rule needs one stable name, whatever the matrix is.
  ci-ok:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = "success"
