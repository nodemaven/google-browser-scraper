name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m patchright install --with-deps chromium
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      # Everything runs offline: the browser tests drive a fake Google on
      # 127.0.0.1, and nothing here needs a proxy or a real search.
      - name: Test
        run: python -m pytest -q

  # The branch protection rule needs one stable name, whatever the matrix is.
  ci-ok:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = "success"
