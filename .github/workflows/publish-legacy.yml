# Publish the old names, `gserp` and `google-browser-scraper`, to PyPI from
# `legacy/`.
#
# Neither package holds code: each depends on `serpmaven` at the same version and
# keeps its old command and import working. They are released from the same
# published GitHub release as `serpmaven` (see publish.yml), through their own
# Trusted Publisher entries on PyPI, which name this file and the `pypi`
# environment.
name: publish-legacy

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build needs no git credentials; keep the token out of .git/config.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build legacy/gserp --outdir dist
      - run: python -m build legacy/google-browser-scraper --outdir dist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist-legacy
          path: dist/

  # Both packages depend on serpmaven, which publish.yml uploads from the same
  # release in a separate workflow. Wait until that version is on PyPI, so
  # nobody can install an old name while its dependency is missing.
  wait-for-serpmaven:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for serpmaven ${{ github.event.release.tag_name }} on PyPI
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          until curl -sf -o /dev/null "https://pypi.org/pypi/serpmaven/${version}/json"; do
            echo "serpmaven ${version} not on PyPI yet"
            sleep 30
          done

  publish:
    needs: wait-for-serpmaven
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-legacy
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
