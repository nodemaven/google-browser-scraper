[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "serpmaven"
version = "0.2.3"
description = "SERP Maven: self-hosted SERP API. Search results as JSON from a real Chrome browser through your own residential proxy. HTTP API, CLI and MCP server."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "NodeMaven" }]
keywords = [
    "google",
    "google-search",
    "google-search-api",
    "serp",
    "serp-api",
    "scraper",
    "search",
    "self-hosted",
    "proxy",
    "mcp",
    "playwright",
    "patchright",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    # Pinned, because each patchright release ships a different Chromium and
    # the browser build is part of what Google sees. 1.64.3 is Chromium 156; a
    # new pin replaces the old one only after both ran side by side on Google.
    "patchright==1.64.3",
    "lxml>=5",
    # Results pages over HTTP between the browser's checks (see `hybrid`):
    # Chromium's TLS and HTTP/2 fingerprint. Pinned for the same reason as
    # patchright: what it impersonates is part of what Google sees.
    "curl_cffi==0.17.0",
    # The NodeMaven SDK builds sticky-session usernames for its gateway. It is
    # small and stdlib-only, so it ships by default and `--nodemaven` works
    # from a one-line install; any other provider works through a proxy URL.
    "nodemaven>=0.1.5",
]

[project.optional-dependencies]
# Kept so `pip install "serpmaven[nodemaven]"` from older instructions still works.
nodemaven = ["nodemaven>=0.1.5"]
# CloakBrowser's patched Chromium; downloads its own binary on first use.
cloak = ["cloakbrowser>=0.5"]
all = ["nodemaven>=0.1.5", "cloakbrowser>=0.5"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
serpmaven = "serpmaven.cli:main"

[project.urls]
Source = "https://github.com/nodemaven/serpmaven"
Issues = "https://github.com/nodemaven/serpmaven/issues"
Benchmark = "https://github.com/nodemaven/proxy-benchmark"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
